# development account (001634074733) — the real, EKS-deployed environment.
# Deployed automatically on every merge to main (deployment plan §12.5).

image:
  repository: "001634074733.dkr.ecr.us-east-1.amazonaws.com/zonic-postgresql-server-fastapi"

env:
  PGF_PROFILE: development
  # config/profiles/development.yaml — auth deliberately off until a real caller
  # exists (see that file's own comment, and deployment plan §12.9 decision 1).

secret:
  dsnSecretName: tripleq/development/tiger-cloud-database-url

ingress:
  # Internet-facing as of 2026-08-27 — explicit, deliberate exception for ad-hoc
  # Postman testing against real data, requested and confirmed with auth left off
  # (see ingress.yaml template's comment and config/profiles/development.yaml).
  # pgfoundation.dev.tripleq.ai's ACM cert + Route 53 zone (infra repo's
  # environments/development/network/main.tf's module.acm / module.route53) were
  # provisioned ahead of time for exactly this (renamed from the original
  # api.dev.tripleq.ai on 2026-08-27, before the domain was ever used live — see
  # infra repo's scripts/aws-commands.ps1). The Route 53 alias record itself is
  # added in the infra repo AFTER this Ingress creates the real ALB (a data
  # source needs the ALB to exist first).
  scheme: internet-facing
  host: "pgfoundation.dev.tripleq.ai"
  certificateArn: "REPLACE_ME — new ACM cert ARN from infra repo's `terraform apply -target=module.acm` output (acm_certificate_arn), pending as of this commit"
  loadBalancerName: "zonic-postgresql-server-pub"

networkPolicy:
  vpcCidr: "10.20.0.0/16"
