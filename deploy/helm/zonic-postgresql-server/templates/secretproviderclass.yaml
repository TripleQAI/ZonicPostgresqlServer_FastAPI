# Mounts the Tiger Cloud DSN from AWS Secrets Manager and syncs it into a native
# Kubernetes Secret (deployment.yaml references that Secret via secretKeyRef — the
# CSI mount itself is not read by the app directly). Requires the
# secrets-store-csi-driver + secrets-store-csi-driver-provider-aws Helm releases,
# installed by the infra repo's new modules/secrets-store-csi-driver module.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: zonic-postgresql-server-dsn
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secret.dsnSecretName }}"
        objectType: "secretsmanager"
  secretObjects:
    - secretName: zonic-postgresql-server-dsn
      type: Opaque
      data:
        - objectName: "{{ .Values.secret.dsnSecretName }}"
          key: {{ .Values.secret.envVarName }}
