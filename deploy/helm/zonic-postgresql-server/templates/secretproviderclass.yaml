# Mounts the Tiger Cloud DSN from AWS Secrets Manager and syncs it into a native
# Kubernetes Secret (deployment.yaml references that Secret via secretKeyRef — the
# CSI mount itself is not read by the app directly). Requires the
# secrets-store-csi-driver + secrets-store-csi-driver-provider-aws Helm releases,
# installed by the infra repo's new modules/secrets-store-csi-driver module.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: zonic-postgresql-server-dsn
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    # Defaults to IRSA (OIDC-based) auth when omitted — this cluster has no OIDC
    # provider set up, only EKS Pod Identity (modules/eks-pod-identity, infra repo).
    # Without this, mounts fail: "CSI token error: serviceAccount.tokens not
    # provided" even after the driver's own tokenRequests audiences are fixed.
    # Found in real use, 2026-08-26.
    usePodIdentity: "true"
    # objectAlias: the CSI driver mounts objectName as a file at that same path,
    # including subdirectories for any "/" in it (Secrets Manager names commonly
    # have them, ours does: tripleq/development/tiger-cloud-database-url) — but
    # secretObjects' file-matching only checks the mount root, never subdirectories,
    # so without an alias the sync silently fails: "file matching objectName ...
    # not found in the pod" (kubernetes-sigs/secrets-store-csi-driver#515). The
    # alias must be flat (no slashes) and is what secretObjects references below,
    # not the raw objectName. Found in real use, 2026-08-26.
    objects: |
      - objectName: "{{ .Values.secret.dsnSecretName }}"
        objectType: "secretsmanager"
        objectAlias: "tsdb-dsn"
      {{- if .Values.secret.callerKeys }}
      # ONE Secrets Manager call for every caller key, not one per caller.
      #
      # Each object here is a separate GetSecretValue over the network, and this
      # cluster's CSI provider intermittently hits multi-minute DNS timeouts
      # reaching Secrets Manager (see the Jenkinsfile's deploy-stage comment and
      # builds #37/#39/#41/#43). With maxUnavailable: 0 the pods roll one at a
      # time, so every extra object multiplies that risk by the replica count --
      # a second object took the rollout from "occasionally slow" to timing out.
      #
      # jmesPath extracts each caller's key from ONE JSON secret, so adding a
      # caller costs a map entry, never another round trip. The AWS provider has
      # supported this since well before the pinned 3.1.2.
      # NO objectAlias here, deliberately: the AWS provider rejects an
      # objectAlias on an object that also has a jmesPath, because each jmesPath
      # entry already carries its own. Setting both makes the mount fail with
      # "Failed to fetch secret from all regions ... Verify secret exists and
      # required permissions are granted" -- a message about permissions for
      # what is actually a spec error. Cost one rollout to find, 2026-09-12.
      - objectName: "{{ .Values.secret.callerKeysSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range .Values.secret.callerKeys }}
          # objectAlias must be flat: secretObjects' file matching never looks
          # in subdirectories, and a subject could contain a "/".
          # The quotes are part of the JMESPath EXPRESSION, not YAML quoting --
          # hence the escaped inner pair. A caller subject contains hyphens, and
          # JMESPath lexes a bare `zonic-authorization-server` as subtraction,
          # not as an identifier (verified: LexerError). YAML would strip a
          # normal quoted scalar, handing the provider the invalid bare form,
          # which it reports as "Failed to fetch secret from all regions ...
          # Verify secret exists and required permissions are granted" -- a
          # message about permissions for what is purely a syntax error.
          # Cost two rollouts to find, 2026-09-12.
          - path: '"{{ .subject }}"'
            objectAlias: "caller-{{ .subject }}"
          {{- end }}
      {{- end }}
  secretObjects:
    - secretName: zonic-postgresql-server-dsn
      type: Opaque
      data:
        - objectName: "tsdb-dsn"
          key: {{ .Values.secret.envVarName }}
        # Caller keys are deliberately NOT synced into this Secret: the app
        # reads them from the mounted FILES instead, because the Secret is
        # populated after the mount and kubelet resolves secretKeyRef before
        # that -- see deployment.yaml's comment. Syncing them anyway would put
        # a second copy of each credential in etcd for nothing to consume.
