# CodeBuild project: tripleq-tooling-zonic-postgresql-server (tooling account,
# infra repo environments/tooling/network). Builds, scans, and pushes the image;
# Jenkins reads IMAGE_DIGEST back from the build's exported environment variables
# — no S3 artifact needed for the digest hand-off.
#
# Uses $IMAGE_TAG (a Jenkins-supplied --environment-variables-override, the git
# commit SHA) rather than $CODEBUILD_RESOLVED_SOURCE_VERSION — that variable is
# only auto-populated when the source has an actual resolved version (e.g. a git
# ref); this project's S3 source has no --source-version override (see Jenkinsfile
# for why), so it comes back empty, producing an invalid "repo:" image tag.
version: 0.2

env:
  exported-variables:
    - IMAGE_DIGEST

phases:
  install:
    commands:
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  build:
    commands:
      - echo "Building $IMAGE_URI"
      - docker build -t "$IMAGE_URI" postgresqlmodule/code

  post_build:
    commands:
      # Fail the build on critical/high findings — waivers go in .trivyignore
      # (repo root), each with a documented reason. See that file for the
      # current list (base-image OS packages this service doesn't use, with no
      # upstream fix yet).
      - syft "$IMAGE_URI" -o spdx-json > sbom.spdx.json
      - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignorefile .trivyignore "$IMAGE_URI"
      - docker push "$IMAGE_URI"
      # --registry-id is required: bare --repository-name defaults to the caller's
      # OWN account (tooling), but this repo lives in development's account —
      # ECR_REGISTRY's leading segment is that account ID.
      - IMAGE_DIGEST=$(aws ecr describe-images --registry-id "${ECR_REGISTRY%%.*}" --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
      - echo "Pushed $IMAGE_URI@$IMAGE_DIGEST"

artifacts:
  files:
    - sbom.spdx.json
