apiVersion: apps/v1
kind: Deployment
metadata:
  name: zonic-postgresql-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zonic-postgresql-server
spec:
  # minReplicas at rest; the HPA (hpa.yaml) takes over scaling within
  # [minReplicas, maxReplicas] once deployed.
  replicas: {{ .Values.replicaCount.min }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Old Pods only drain once new ones pass /ready — a broken image never
      # removes serving capacity (deployment plan §12.2's ECS-circuit-breaker
      # equivalent, combined with `helm upgrade --atomic` at the release level).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zonic-postgresql-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zonic-postgresql-server
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zonic-postgresql-server
      containers:
        - name: zonic-postgresql-server
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.container.port }}
              name: http
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: {{ .Values.secret.envVarName }}
              valueFrom:
                secretKeyRef:
                  name: zonic-postgresql-server-dsn
                  key: {{ .Values.secret.envVarName }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # Kubernetes' default httpGet timeoutSeconds is 1 — far shorter than
            # /ready's own SELECT 1 can legitimately take against a remote database
            # (Tiger Cloud, WAN latency + TLS handshake) or a still-warming pool
            # right after startup (pgfoundation.yaml's tsdb datasource sets
            # acquire_timeout_seconds: 10). Without this, every fresh pod flapped
            # through repeated "context deadline exceeded" failures for a minute
            # or more — confirmed via real event timestamps, 2026-08-27 (build
            # #41's rolling update), not a real app problem.
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            # /health no longer touches the database (see ops.py's docstring), so
            # this needs far less headroom than readinessProbe — kept explicit
            # rather than the 1s default purely for margin against a transient
            # scheduling/GC pause, not because /health is expected to be slow.
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.container.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tsdb-dsn
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tsdb-dsn
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: zonic-postgresql-server-dsn
        - name: tmp
          emptyDir: {}
