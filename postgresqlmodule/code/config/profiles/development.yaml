# development overlay — the real, EKS-deployed development environment
# (dev.tripleq.ai). Distinct from `dev.yaml`, which is explicitly for local-only use
# ("never use for anything reachable from outside") — this one is reachable by other
# services inside the VPC, so it can't inherit that profile's permissiveness.
#
# auth is ENABLED as of 2026-09-12, closing doc 14 §14.5's standing constraint
# ("do not onboard a second consuming API until the deployment carries real caller
# identity"). The Authorization Server is that second consumer, so the constraint
# came due. provider: token, never mtls — §12.8: mtls behind a plain,
# Ingress-created ALB trusts a client-supplied header the ALB does not strip.

auth:
  enabled: true

  # SharedSecretAuthenticator: a per-caller key, compared as a SHA-256 digest in
  # constant time (security/providers.py). Keys live in Secrets Manager, one per
  # caller, and reach the process as PGF_API_KEY_<SUBJECT> env vars — the config
  # file names WHO may call, the secret store holds WHAT PROVES IT (doc 05).
  #
  # The service refuses to start if a subject below has no key, so a deploy fails
  # loudly rather than serving 401s to a caller whose credential was never synced.
  provider: token

  policy:
    # Anything not named below is refused. With enabled: true this is the only
    # defensible default: an unknown caller is not a partially-trusted caller.
    default: deny

    callers:
      # The Authorization Server reads user_schema.users, user_credentials and
      # oauth_clients, and writes through record_credential_failure /
      # record_credential_success. Those are /function and /procedure calls,
      # which the authorizer classes as `write` — so `read` alone would break
      # account lockout while leaving login working, a confusing partial failure.
      #
      # zonic-bff is deliberately absent: its only outbound HTTP client is
      # AuthorizationServerClient (zonic_bff/client/authorization_server.py). It
      # never calls pgfoundation, so a key for it would be a credential with no
      # purpose.
      - subject: zonic-authorization-server
        datasources: [tsdb]
        actions: [read, write]

api:
  # Off now that auth is on. /docs on an authenticated service is not a
  # vulnerability, but it is a free map of the surface for anyone probing the
  # endpoint, and the OpenAPI snapshot in this repo serves the same purpose for
  # engineers who need it.
  docs_enabled: false
  enable_raw_sql: false     # never ships past local dev, regardless of auth state

observability:
  provider: none            # otel adapter doesn't exist yet (§12.8c) — only metrics does
  metrics_enabled: true
  log_level: info
  slow_query_ms: 150
