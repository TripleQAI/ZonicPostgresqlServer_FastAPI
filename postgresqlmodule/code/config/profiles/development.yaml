# development overlay — the real, EKS-deployed development environment
# (dev.tripleq.ai). Distinct from `dev.yaml`, which is explicitly for local-only use
# ("never use for anything reachable from outside") — this one is reachable by other
# services inside the VPC, so it can't inherit that profile's permissiveness.
#
# auth was ENABLED on 2026-09-12, closing doc 14 §14.5's standing constraint
# ("do not onboard a second consuming API until the deployment carries real caller
# identity"). provider: token, never mtls — §12.8: mtls behind a plain,
# Ingress-created ALB trusts a client-supplied header the ALB does not strip.
#
# DISABLED again on 2026-11-23, by explicit owner decision, so the data pipeline
# can call without a caller key. What that means, stated plainly: every request
# is `anonymous` and may read and write EVERY data source below -- zdp_config AND
# tsdb, which holds the Authorization Server's users, user_credentials and
# oauth_clients -- from anywhere that can reach pgfoundation.dev.tripleq.ai,
# which is internet-facing behind only the WAF (values-development.yaml). Raw SQL
# stays off (api.enable_raw_sql below), so access is still name-based only.
#
# To re-enable: set `enabled: true`, restore secret.callerKeys in
# values-development.yaml, and issue the zonic-datapipeline-service key
# (ZonicPlatformInfrastructure scripts/rotate-pgfoundation-caller-key.ps1). The
# provider and policy below are kept, unread while disabled, so that is the
# whole change.

auth:
  enabled: false

  # SharedSecretAuthenticator: a per-caller key, compared as a SHA-256 digest in
  # constant time (security/providers.py). Keys live in Secrets Manager, one per
  # caller, and reach the process as PGF_API_KEY_<SUBJECT> env vars — the config
  # file names WHO may call, the secret store holds WHAT PROVES IT (doc 05).
  #
  # The service refuses to start if a subject below has no key, so a deploy fails
  # loudly rather than serving 401s to a caller whose credential was never synced.
  provider: token

  policy:
    # Anything not named below is refused. With enabled: true this is the only
    # defensible default: an unknown caller is not a partially-trusted caller.
    default: deny

    callers:
      # The Authorization Server reads user_schema.users, user_credentials and
      # oauth_clients, and writes through record_credential_failure /
      # record_credential_success. Those are /function and /procedure calls,
      # which the authorizer classes as `write` — so `read` alone would break
      # account lockout while leaving login working, a confusing partial failure.
      #
      # zonic-bff is deliberately absent: its only outbound HTTP client is
      # AuthorizationServerClient (zonic_bff/client/authorization_server.py). It
      # never calls pgfoundation, so a key for it would be a credential with no
      # purpose.
      - subject: zonic-authorization-server
        datasources: [tsdb]
        actions: [read, write]

      # ZonicDataPipelineService_FastAPI persists Build Canvas drafts, layouts
      # and publishes. It reads the pipeline/pipeline_draft tables and the
      # workflow status view through /view, and writes only through the three
      # sp_* procedures from the pipeline server's migration 005 -- /procedure
      # calls, which the authorizer classes as `write`. zdp_config only: it has
      # no business in the Authorization Server's tsdb data.
      - subject: zonic-datapipeline-service
        datasources: [zdp_config]
        actions: [read, write]

api:
  # Off. /docs is a free map of the surface for anyone probing the endpoint --
  # more so with auth disabled -- and the OpenAPI snapshot in this repo serves
  # the same purpose for engineers who need it.
  docs_enabled: false
  enable_raw_sql: false     # never ships past local dev, regardless of auth state

observability:
  provider: none            # otel adapter doesn't exist yet (§12.8c) — only metrics does
  metrics_enabled: true
  log_level: info
  slow_query_ms: 150
