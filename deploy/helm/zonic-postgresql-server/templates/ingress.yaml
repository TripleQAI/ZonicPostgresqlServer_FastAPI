{{- if .Values.ingress.enabled }}
# scheme: internal was the original design point — nothing about this API's raw,
# caller-level (not end-user-level) data access was meant to sit on the public
# internet (deployment plan §12.2 / app repo's own §15.3 reasoning). development's
# scheme is internet-facing as of 2026-08-27, an explicit, deliberate exception for
# ad-hoc Postman testing against real data — WITHOUT auth (auth.enabled stays false;
# see config/profiles/development.yaml). Token auth is planned but not yet wired up
# (build_auth_gate is never passed api_keys — see security/gate.py). Do not copy
# this scheme value to values-production.yaml without auth actually enabled first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zonic-postgresql-server
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    {{- if .Values.ingress.wafAclArn }}
    # The AWS Load Balancer Controller owns this ALB, so it must also own the
    # WAF association -- a Terraform aws_wafv2_web_acl_association for the same
    # ALB would fight this annotation, each apply reverting the other. The infra
    # repo creates the ACL and outputs its ARN; this associates it.
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.ingress.wafAclArn }}
    {{- end }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath }}
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    # An NDJSON stream or SSE subscription with a gap longer than this is silently
    # cut by the ALB — the client sees a truncated stream, not an error (app repo's
    # §15.10). /subscribe additionally needs an SSE heartbeat, application-side,
    # before it's safe behind this ALB — deployment plan §12.7 P-CD5, not done yet.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeoutSeconds }}
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds={{ .Values.ingress.deregistrationDelaySeconds }}
    {{- if .Values.ingress.loadBalancerName }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName }}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zonic-postgresql-server
                port:
                  number: {{ .Values.container.port }}
{{- end }}
