# development account (001634074733) — the real, EKS-deployed environment.
# Deployed automatically on every merge to main (deployment plan §12.5).

image:
  repository: "001634074733.dkr.ecr.us-east-1.amazonaws.com/zonic-postgresql-server-fastapi"

env:
  PGF_PROFILE: development
  # config/profiles/development.yaml — auth is ON as of 2026-09-12; the
  # Authorization Server is the real caller doc 14 §14.5 was waiting for.

secret:
  dsnSecretName: tripleq/development/tiger-cloud-database-url

  # Must match auth.policy.callers in config/profiles/development.yaml. The
  # service refuses to start on a policy subject with no key here, so the two
  # lists are checked against each other at startup rather than drifting.
  #
  # The container is created by the infra repo (environments/development/network's
  # module.secrets_manager); the VALUE is generated separately by that repo's
  # scripts/rotate-pgfoundation-caller-key.ps1, so no key is ever in Terraform
  # state or in this file.
  callerKeys:
    - subject: zonic-authorization-server
      secretName: pgfoundation/callers/zonic-authorization-server

ingress:
  # Internet-facing as of 2026-08-27 — explicit, deliberate exception for ad-hoc
  # Postman testing against real data, requested and confirmed with auth left off
  # (see ingress.yaml template's comment and config/profiles/development.yaml).
  # pgfoundation.dev.tripleq.ai's ACM cert + Route 53 zone (infra repo's
  # environments/development/network/main.tf's module.acm / module.route53) were
  # provisioned ahead of time for exactly this (renamed from the original
  # api.dev.tripleq.ai on 2026-08-27, before the domain was ever used live — see
  # infra repo's scripts/aws-commands.ps1). The Route 53 alias record itself is
  # added in the infra repo AFTER this Ingress creates the real ALB (a data
  # source needs the ALB to exist first).
  scheme: internet-facing
  # WAF: AWSManagedRulesCommonRuleSet + KnownBadInputs + a per-IP rate limit,
  # with the authorization and cookie headers redacted from WAF logs so a
  # caller's API key never lands in CloudWatch.
  #
  # Fill from the infra repo, AFTER applying environments/development/network:
  #   terraform output -raw application_waf_web_acl_arn
  #
  # Left empty until then on purpose: a wrong ARN is rejected by the controller
  # and the Ingress stops reconciling, which is worse than no WAF.
  wafAclArn: ""
  host: "pgfoundation.dev.tripleq.ai"
  certificateArn: "arn:aws:acm:us-east-1:001634074733:certificate/1f9da6b8-35d9-4c5e-a1c3-e17480da20be"
  loadBalancerName: "zonic-postgresql-server-pub"

networkPolicy:
  vpcCidr: "10.20.0.0/16"
