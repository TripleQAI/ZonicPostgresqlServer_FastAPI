apiVersion: v1
kind: Service
metadata:
  name: zonic-postgresql-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zonic-postgresql-server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.container.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: zonic-postgresql-server
