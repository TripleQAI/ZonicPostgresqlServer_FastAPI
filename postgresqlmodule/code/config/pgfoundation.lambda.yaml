# pgfoundation — AWS Lambda config (deploy/aws-lambda/).
#
# Structure and tunables only. NO SECRETS: the DSNs and the caller key reach the
# function as Lambda environment variables (encrypted at rest), resolved by the
# loader through ${env:...} exactly as in every other deployment target.
#
# Connection budget: one process per Lambda execution environment, and this
# account allows at most 10 concurrent environments, so the worst case is
# 10 x pool.max_size = 30 connections per datasource. neondb and neondb_dev are
# separate Neon branches with their own computes, so each sees at most 30;
# agentruntime, agentobservability and agentbuilder share one compute, which sees
# at most 90; tripleq_synth and tripleq_synth_dev are separate branches of their
# own project, so each sees at most 30. All are inside a Neon free-plan compute's
# connection limit; lower a max_size before adding another datasource on a compute.

datasources:
  # --- neondb: Neon free plan -------------------------------------------------
  # The alias IS the database name (Neon's default database is `neondb`).
  # Use the DIRECT endpoint (host without "-pooler") so server-side cursors and
  # session SET keep working (§12.6).
  #
  # Tuned for an environment that is frozen between requests while Neon
  # suspends its compute after ~5 idle minutes:
  #   * min_size 0      — idle connections are not worth holding across a freeze.
  #   * max_idle 240s   — drop idle connections before Neon's suspend would.
  #   * max_size 3      — keeps the 30-connection worst case above.
  #   * acquire_timeout 10s — leaves room for a Neon cold start (compute resume).
  #   * check_on_checkout — a frozen environment cannot drop idle connections on
  #                     time, so validate each one as it leaves the pool. Without
  #                     it, the first request after a Neon suspend fails (tested:
  #                     57P01 surfaced as HTTP 400).
  - name: neondb
    dsn: ${env:PGF_NEON_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  # --- neondb_dev: Neon branch `dev` ------------------------------------------
  # Development and the builder's live test suite, so test data never touches
  # the production branch. Same database name (`neondb`) on its own compute;
  # same tuning as above, for the same reasons.
  - name: neondb_dev
    dsn: ${env:PGF_NEON_DEV_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  # --- agentruntime / agentobservability: the Agent Runtime's database ---------
  # Neon project `agent-build-langgraph`, branch `production`, database `neondb`,
  # holding the agent_builder, agent_runtime and agent_observability schemas
  # (ZonicAgentRuntimeBackend_Python_LangGraph, decision D-2). The names are the
  # runtime's settings.gateway.datasources. Both currently point at the same compute,
  # so it sees at most 10 x (3 + 3) = 60 connections, inside a free-plan compute's
  # limit. Same tuning as above, for the same reasons.
  - name: agentruntime
    dsn: ${env:PGF_AGENTRUNTIME_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  - name: agentobservability
    dsn: ${env:PGF_AGENTOBSERVABILITY_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  # --- agentbuilder: the Agent Builder's workflows, in the same database -------
  # Since 2026-10-26 the builder (Strands-visual-builder) saves its workflows in
  # agent-build-langgraph's agent_builder schema, where the runtime reads them. Its
  # own datasource keeps the builder's pool and admission limits apart from the
  # runtime's. Same tuning as above, for the same reasons.
  - name: agentbuilder
    dsn: ${env:PGF_AGENTBUILDER_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  # --- tripleq_synth / tripleq_synth_dev: the synthetic data pipeline ----------
  # Neon project `synthetic-data-pipeline` (ZonicSyntheticDataPipeline_Fullstack),
  # database `neondb`, schema `tripleq_synth`: branch `production` is tripleq_synth,
  # branch `dev` is tripleq_synth_dev. Each DSN logs in as the pipeline's own
  # application role, which can only read its views and execute its procedures.
  # Same tuning as above, for the same reasons.
  - name: tripleq_synth
    dsn: ${env:PGF_TRIPLEQ_SYNTH_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

  - name: tripleq_synth_dev
    dsn: ${env:PGF_TRIPLEQ_SYNTH_DEV_DSN}
    role: standalone
    statement_timeout_ms: 30000
    pool: { min_size: 0, max_size: 3, acquire_timeout_seconds: 10, max_idle_seconds: 240, max_lifetime_seconds: 1800, check_on_checkout: true }
    stream: { itersize: 5000 }

resilience:
  retry: { max_attempts: 3, base_backoff_ms: 20, max_backoff_ms: 1000, jitter: true }
  circuit_breaker: { enabled: true, failure_threshold: 5, reset_timeout_seconds: 30 }

concurrency:
  # Must stay within the sum of pool.max_size (3 + 3), or the limiter would admit
  # work the pools cannot hold (doc 05 §5.5). Per datasource it must stay within
  # that datasource's max_size (3).
  max_inflight_total: 3
  max_inflight_per_datasource: 3
  admission_timeout_ms: 2000

batch:
  # Must be <= concurrency.max_inflight_total.
  max_concurrency: 3

auth:
  # A public Function URL must authenticate callers (ADR-008). Token provider:
  # each caller's key arrives as PGF_API_KEY_<SUBJECT>; anything not listed is refused.
  enabled: true
  provider: token
  policy:
    default: deny
    callers:
      # The Agent Builder (Strands-visual-builder, ZonicAgentBuilderServer_FastAPI) reads
      # views and calls procedures, so it needs both actions. It uses agentbuilder;
      # neondb and neondb_dev stay reachable for its earlier data.
      - subject: zonic-agent-builder
        datasources: [agentbuilder, neondb, neondb_dev]
        actions: [read, write]
      # The Agent Runtime (ZonicAgentRuntimeBackend_Python_LangGraph) reads views and
      # calls procedures on its own database. One rule per subject (later entries
      # replace earlier ones), so builder-database access, if the runtime ever needs
      # it, is added to this rule's datasources. `batch` admits /v1/batch (a warm turn
      # starts with one sequential batch); each item must still pass this rule's
      # datasources (security/gate.py).
      - subject: zonic-agent-runtime
        datasources: [agentruntime, agentobservability, batch]
        actions: [read, write]
      # The Node Agent Runtime (ZonicAgentRuntimeServer_Nodejs) uses only Neon project
      # agent-build-run: on branch dev, the builder's agent_builder views and its own
      # agent_runtime and agent_observability schemas. `batch` admits /v1/batch, whose
      # items must each pass this rule's datasources too (security/gate.py).
      - subject: zonic-agent-runtime-node
        datasources: [neondb_dev, batch]
        actions: [read, write]
      # The synthetic data pipeline (ZonicSyntheticDataPipeline_Fullstack: synth-api and
      # synth-worker) reads views and calls procedures in its own project only, never an
      # Agent database. `batch` admits /v1/batch (the worker claims a job and reads its
      # lease in one transactional batch); each item must still pass this rule's datasources.
      - subject: zonic-synthetic-pipeline
        datasources: [tripleq_synth, tripleq_synth_dev, batch]
        actions: [read, write]

api:
  docs_enabled: false       # no free map of the surface on a public endpoint
  enable_raw_sql: false     # raw SQL never ships past local dev

observability:
  provider: none
  log_level: info
